[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "meshcore-ai-bot"
version = "0.4.2"
description = "A standalone, policy-driven MeshCore AI bot for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Ideenwerft Friedenau contributors"}]
keywords = ["meshcore", "lora", "raspberry-pi", "chatbot", "amateur-radio"]
dependencies = ["httpx>=0.28.1,<0.29", "python-dotenv>=1.0,<2", "tomli-w>=1.2,<2"]

[project.optional-dependencies]
radio = ["meshcore==2.3.15"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
meshcore-ai = "meshcore_ai_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meshcore_ai_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
