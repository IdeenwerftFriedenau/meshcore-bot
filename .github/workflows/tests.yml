name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev,radio,phone]'
      - run: ruff check .
      - run: pytest
      - run: python -m build
      - run: bash -n scripts/install-pi.sh
      - run: bash -n scripts/rollback-pi.sh
      - run: python scripts/soak-test.py --cycles 2 --output /tmp/meshcore-soak-report.json
      - run: meshcore-ai replay --config config.example.toml --offline examples/radio-cases.json
